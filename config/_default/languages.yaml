# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://docs.hugoblox.com/reference/language/
#   English lives at the site root; Spanish is served under /es/.
#   Spanish pages are the `.es.md` files next to the English ones in `content/`,
#   and Spanish profile text is in `data/es/authors/me.yaml`.

# Default language
en:
  locale: en-us
  label: English
  weight: 1

# Spanish
es:
  locale: es
  label: Español
  weight: 2
  params:
    hugoblox:
      identity:
        tagline: "Analista de Datos"
        description: "Jose Franco, analista de datos que trabaja con SQL, Power BI, SSRS y SSIS en datos de pozos y producción de petróleo y gas."
