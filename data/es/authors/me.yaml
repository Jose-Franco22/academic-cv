experience:
  - role: Analista de Datos
    org: University Lands
    logo: university-lands.png
    start: 2026-08-01
    summary: |
      - Desarrollo y mantengo reportes de SSRS y dashboards de Power BI que dan seguimiento al rendimiento de los pozos y a la producción de petróleo y gas para los equipos de operaciones y contabilidad.
      - Colaboré con contabilidad para crear un dashboard de Power BI que da seguimiento a las variaciones en los pagos de operadores, identificando cerca de 1,000 discrepancias de un solo operador durante el último año y recuperando aproximadamente $5,000.
      - Desarrollé el primer reporte de conciliación entre aplicaciones de la empresa, comparando los números de propiedad de 30,000 pozos en los sistemas de contabilidad y de administración de tierras, e identificando 18,000 registros sin coincidencia con 100% de precisión.
      - Dirijo la optimización de consultas de los dashboards de Power BI de contabilidad para resolver errores de memoria durante la actualización.
    button:
      text: Descargar currículum
      url: uploads/resume.pdf
      icon: hero/arrow-down-tray
  - role: Pasante de Analista de Datos
    org: University Lands
    logo: university-lands.png
    start: 2026-06-01
    end: 2026-08-31
    summary: |
      - Creé un dashboard de gobernanza de SSRS que da seguimiento al uso, tiempos de ejecución, errores, suscripciones, conjuntos de datos y fuentes de datos de 500 reportes, revelando que el 80% (unos 400) no se usaban.
      - Diseñé un Puntaje de Complejidad personalizado, basado en conjuntos de datos, fuentes de datos y longitud de las consultas, para clasificar los ~100 reportes activos según el esfuerzo de migración.
      - Desarrollé un dashboard de monitoreo de SSIS para 200 paquetes que registra éxitos y fallas, duración de ejecuciones e historial de trabajos, con un diagnóstico paso a paso de cada falla.
      - Creé un clasificador de errores basado en palabras clave que resumió registros de error largos de SSIS en categorías de dos palabras, reduciendo el tiempo de diagnóstico de unos 10 minutos a unos pocos segundos.
  - role: Pasante de Aseguramiento de Calidad
