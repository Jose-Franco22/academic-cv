    logo: kemper.png
    start: 2026-02-01
    end: 2026-04-30
    summary: |
      - Creé un dashboard de Power BI que registra la actividad de la aplicación de unos 10,000 usuarios, detectando aproximadamente 15 anomalías, como inicios de sesión fuera del horario laboral.
  - role: Técnico de Soporte de TI
