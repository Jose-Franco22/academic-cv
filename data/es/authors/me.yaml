      - Dirigí más de 20 sesiones de estudio sobre estructuras de datos y algoritmos para un grupo de más de 30 estudiantes, logrando una mejora promedio del 15% en las calificaciones de los exámenes.
      - Asesoré a compañeros en depuración de código y resolución de problemas algorítmicos, aumentando en un 25% la eficiencia de los proyectos en grupo y la participación entre compañeros.
