  - role: Asistente de Investigación
    org: Machine Intelligence Lab, UTRGV
    logo: utrgv.png
    start: 2024-11-01
    end: 2026-08-31
    summary: |
      - Di seguimiento a los hitos del proyecto y dirigí un equipo de 3 investigadores para cumplir con los plazos de investigación.
      - Realicé análisis de datos puntuales en Python para ajustar los parámetros de los modelos.
  - role: Tutor
    org: The Learning Center at UTRGV
